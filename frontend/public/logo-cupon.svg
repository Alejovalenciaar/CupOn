<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" fill="none">
  <!-- Ticket Icon with fork, knife and dish -->
  <g transform="translate(10, 15)">
    <!-- Ticket outline -->
    <path d="M 35 15 C 35 25, 45 35, 55 35 C 65 35, 75 25, 75 15 L 105 15 C 108 15, 110 17, 110 20 L 110 130 C 110 133, 108 135, 105 135 L 75 135 C 75 125, 65 115, 55 115 C 45 115, 35 125, 35 135 L 5 135 C 2 135, 0 133, 0 130 L 0 20 C 0 17, 2 15, 5 15 Z" fill="none" stroke="#EA580C" stroke-width="7" stroke-linejoin="round" />
    
    <!-- Dish / Coffee cup outline top -->
    <path d="M 28 22 C 38 45, 72 45, 82 22" fill="none" stroke="#D97706" stroke-width="6" stroke-linecap="round" />
    <path d="M 38 25 L 72 25" stroke="#D97706" stroke-width="5" stroke-linecap="round" />

    <!-- Fork (left) -->
    <path d="M 0 95 L 35 60" stroke="#EA580C" stroke-width="6" stroke-linecap="round" />
    <path d="M 32 63 L 44 51" stroke="#EA580C" stroke-width="6" stroke-linecap="round" />
    <path d="M 30 54 L 38 46" stroke="#EA580C" stroke-width="4" stroke-linecap="round" />
    <path d="M 40 64 L 48 56" stroke="#EA580C" stroke-width="4" stroke-linecap="round" />

    <!-- Knife (right) filled curved -->
    <path d="M 110 35 C 110 50, 100 70, 78 85 L 45 110 C 65 95, 75 75, 78 60 Z" fill="#D97706" />
  </g>

  <!-- Wordmark "CupOn" -->
  <text x="145" y="115" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="95" letter-spacing="-3">
    <tspan fill="#EA580C">Cup</tspan><tspan fill="#D97706">On</tspan>
  </text>
  
  <!-- Underline tray beneath 'On' -->
  <path d="M 330 135 L 460 135 C 465 135, 468 138, 465 142 L 458 147 C 456 149, 452 150, 448 150 L 342 150 C 338 150, 334 149, 332 147 L 325 142 C 322 138, 325 135, 330 135 Z" fill="#D97706" />
