spring:
  application:
    name: cupon

  # --- Virtual Threads (Project Loom) ---
  threads:
    virtual:
      enabled: true

  # --- DataSource (PostgreSQL) ---
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRESS_DB_CUPON:cupon_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  # --- Flyway ---
  flyway:
    enabled: true
    locations: classpath:db/migration

  # --- Redis ---
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # --- Mail (SMTP) ---
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

  # --- Spring AI: Chat (Groq, API compatible con OpenAI) ---
  ai:
    model:
      chat: openai
      embedding: transformers
    openai:
      api-key: ${GROQ_API_KEY:}
      # Sin "/v1" final: Spring AI 1.1.x concatena "/v1/chat/completions" al base-url
      # internamente (OpenAiApi.completionsPath). Ponerlo aquí también duplica el
      # "/v1" y Groq responde 404 "Unknown request URL: /openai/v1/v1/...".
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: openai/gpt-oss-20b
          temperature: 0.2
    # --- Spring AI: Embeddings locales (Transformers ONNX) ---
    # Se usa la variante MULTILINGÜE de e5 (no e5-small-v2, que es solo inglés):
    # toda la base de conocimiento del chatbot está en español.
    embedding:
      transformer:
        tokenizer:
          uri: https://huggingface.co/intfloat/multilingual-e5-small/resolve/main/tokenizer.json
          options:
            padding: true
        onnx:
          model-uri: https://huggingface.co/intfloat/multilingual-e5-small/resolve/main/onnx/model.onnx

# --- JWT (custom properties) ---
app:
  jwt:
    secret: ${JWT_SECRET_CUPON:${JWT_SECRET:}}
    expiration: ${JWT_EXPIRATION_CUPON:${JWT_EXPIRATION:86400000}}
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  password-reset:
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:30}

# --- OpenAPI / Swagger ---
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# --- Server ---
server:
  port: 8080
  servlet:
    context-path: /

# --- Logging ---
logging:
  level:
    com.cupon: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
