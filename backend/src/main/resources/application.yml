spring:
  application:
    name: cupon

  # --- Virtual Threads (Project Loom) ---
  threads:
    virtual:
      enabled: true

  # --- DataSource (PostgreSQL) ---
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cupon_db}
    username: ${DB_USER:cupon}
    password: ${DB_PASSWORD:cupon123}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  # --- Flyway ---
  flyway:
    enabled: true
    locations: classpath:db/migration

  # --- Redis ---
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# --- JWT (custom properties) ---
app:
  jwt:
    secret: ${JWT_SECRET:my-super-secret-key-for-development-only-change-in-production-256-bits!}
    expiration: ${JWT_EXPIRATION:86400000}

# --- OpenAPI / Swagger ---
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# --- Server ---
server:
  port: 8080
  servlet:
    context-path: /

# --- Logging ---
logging:
  level:
    com.cupon: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
