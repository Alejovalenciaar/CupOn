services:
  # --- PostgreSQL ---
  db:
    image: postgres:16-alpine
    container_name: cupon_db
    environment:
      POSTGRES_DB: ${POSTGRESS_DB_CUPON}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRESS_DB_CUPON}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- Redis ---
  redis:
    image: redis:7-alpine
    container_name: cupon-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- Microservicio de Optimización (Python / FastAPI + SciPy Simplex) ---
  optimizer:
    build:
      context: ./optimizer
      dockerfile: Dockerfile
    container_name: cupon-optimizer
    expose:
      - "8000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # --- Backend (Spring Boot) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cupon-backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRESS_DB_CUPON: ${POSTGRESS_DB_CUPON}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET_CUPON: ${JWT_SECRET_CUPON:-${JWT_SECRET:-changeme}}
      JWT_EXPIRATION_CUPON: ${JWT_EXPIRATION_CUPON:-${JWT_EXPIRATION:-86400000}}
      JWT_SECRET: ${JWT_SECRET:-${JWT_SECRET_CUPON:-changeme}}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-${JWT_EXPIRATION_CUPON:-86400000}}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      PASSWORD_RESET_EXPIRATION_MINUTES: ${PASSWORD_RESET_EXPIRATION_MINUTES:-30}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      SPRING_PROFILES_ACTIVE: prod
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-cupon}
      OPTIMIZER_URL: ${OPTIMIZER_URL:-http://optimizer:8000}

    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --output /dev/null http://localhost:8080/api/v1/categories || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 300s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      optimizer:
        condition: service_healthy
    restart: unless-stopped

  # --- Frontend (React + Nginx) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cupon-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
